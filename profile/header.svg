<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Akash Baloni — I build end-to-end ML projects, from raw data to live web apps">
  <title>Akash Baloni — End-to-end ML projects, from raw data to live web apps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.6" stop-color="#1f2335"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .tag { font-size: 20px; fill: #c0caf5; }
    .chip { font-size: 13px; font-weight: 600; }
    .node { fill: #7aa2f7; }
    .edge { stroke: #7aa2f7; stroke-opacity: .22; stroke-width: 1.2; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .l1 { opacity: 1; animation: cycle 9s ease-in-out infinite; }
    .l2 { opacity: 0; animation: cycle 9s ease-in-out 3s infinite both; }
    .l3 { opacity: 0; animation: cycle 9s ease-in-out 6s infinite both; }
    @keyframes cycle { 0% { opacity: 0 } 5% { opacity: 1 } 30% { opacity: 1 } 35% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .l1, .pulse { animation: none; opacity: 1; }
      .l2, .l3 { animation: none; opacity: 0; }
    }
  </style>

  <rect width="1000" height="250" rx="16" fill="url(#bg)"/>
  <ellipse cx="500" cy="105" rx="360" ry="120" fill="url(#glow)"/>

  <!-- left neural net -->
  <g transform="translate(40,45)">
    <line class="edge" x1="0" y1="20" x2="60" y2="0"/><line class="edge" x1="0" y1="20" x2="60" y2="60"/><line class="edge" x1="0" y1="20" x2="60" y2="120"/>
    <line class="edge" x1="0" y1="90" x2="60" y2="0"/><line class="edge" x1="0" y1="90" x2="60" y2="60"/><line class="edge" x1="0" y1="90" x2="60" y2="120"/>
    <line class="edge" x1="0" y1="150" x2="60" y2="60"/><line class="edge" x1="0" y1="150" x2="60" y2="120"/>
    <line class="edge" x1="60" y1="0" x2="120" y2="55"/><line class="edge" x1="60" y1="60" x2="120" y2="55"/><line class="edge" x1="60" y1="120" x2="120" y2="55"/>
    <line class="edge" x1="60" y1="60" x2="120" y2="115"/><line class="edge" x1="60" y1="120" x2="120" y2="115"/>
    <circle class="node" cx="0" cy="20" r="5"/><circle class="node" cx="0" cy="90" r="5"/><circle class="node" cx="0" cy="150" r="5"/>
    <circle class="node pulse" cx="60" cy="0" r="5"/><circle class="node" cx="60" cy="60" r="5"/><circle class="node pulse" cx="60" cy="120" r="5" style="animation-delay:1s"/>
    <circle cx="120" cy="55" r="6" fill="#bb9af7" class="pulse" style="animation-delay:.5s"/><circle cx="120" cy="115" r="6" fill="#bb9af7"/>
  </g>

  <!-- right neural net (mirrored) -->
  <g transform="translate(960,45) scale(-1,1)">
    <line class="edge" x1="0" y1="20" x2="60" y2="0"/><line class="edge" x1="0" y1="20" x2="60" y2="60"/><line class="edge" x1="0" y1="20" x2="60" y2="120"/>
    <line class="edge" x1="0" y1="90" x2="60" y2="0"/><line class="edge" x1="0" y1="90" x2="60" y2="60"/><line class="edge" x1="0" y1="90" x2="60" y2="120"/>
    <line class="edge" x1="0" y1="150" x2="60" y2="60"/><line class="edge" x1="0" y1="150" x2="60" y2="120"/>
    <line class="edge" x1="60" y1="0" x2="120" y2="55"/><line class="edge" x1="60" y1="60" x2="120" y2="55"/><line class="edge" x1="60" y1="120" x2="120" y2="55"/>
    <line class="edge" x1="60" y1="60" x2="120" y2="115"/><line class="edge" x1="60" y1="120" x2="120" y2="115"/>
    <circle class="node" cx="0" cy="20" r="5"/><circle class="node pulse" cx="0" cy="90" r="5" style="animation-delay:1.5s"/><circle class="node" cx="0" cy="150" r="5"/>
    <circle class="node" cx="60" cy="0" r="5"/><circle class="node pulse" cx="60" cy="60" r="5" style="animation-delay:2s"/><circle class="node" cx="60" cy="120" r="5"/>
    <circle cx="120" cy="55" r="6" fill="#7dcfff"/><circle cx="120" cy="115" r="6" fill="#7dcfff" class="pulse"/>
  </g>

  <text x="500" y="62" text-anchor="middle" class="f" font-size="18" fill="#787c99">Hi there, I'm</text>
  <text x="500" y="118" text-anchor="middle" class="f" font-size="52" font-weight="800" fill="url(#name)" letter-spacing="1">Akash Baloni</text>

  <text x="500" y="158" text-anchor="middle" class="f tag l1">I build end-to-end ML projects — from raw data to live web apps</text>
  <text x="500" y="158" text-anchor="middle" class="f tag l2">NLP · Churn Analytics · A/B Testing · SQL</text>
  <text x="500" y="158" text-anchor="middle" class="f tag l3">Currently levelling up in LLMs, RAG &amp; MLOps</text>

  <!-- pipeline chips -->
  <g class="f chip" transform="translate(519,200)">
    <g transform="translate(-318,0)">
      <rect x="0" y="-16" width="118" height="30" rx="15" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".5"/>
      <text x="59" y="4" text-anchor="middle" fill="#7aa2f7">Raw Data</text>
    </g>
    <text x="-182" y="4" text-anchor="middle" fill="#565f89">→</text>
    <g transform="translate(-164,0)">
      <rect x="0" y="-16" width="118" height="30" rx="15" fill="#bb9af7" fill-opacity=".12" stroke="#bb9af7" stroke-opacity=".5"/>
      <text x="59" y="4" text-anchor="middle" fill="#bb9af7">Analysis</text>
    </g>
    <text x="-28" y="4" text-anchor="middle" fill="#565f89">→</text>
    <g transform="translate(-10,0)">
      <rect x="0" y="-16" width="118" height="30" rx="15" fill="#e0af68" fill-opacity=".12" stroke="#e0af68" stroke-opacity=".5"/>
      <text x="59" y="4" text-anchor="middle" fill="#e0af68">ML Model</text>
    </g>
    <text x="126" y="4" text-anchor="middle" fill="#565f89">→</text>
    <g transform="translate(144,0)">
      <rect x="0" y="-16" width="136" height="30" rx="15" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".5"/>
      <text x="68" y="4" text-anchor="middle" fill="#9ece6a">Live Web App</text>
    </g>
  </g>
</svg>
